<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>경사하강법 v0.3</title>
</head>
<body>
  <div id="curves">곡선: </div>
  <canvas id="plot" width="600" height="400" style="border:1px solid #ccc; cursor:crosshair"></canvas>
  <div>
    <button id="play">재생</button>
    <button id="step">한 스텝</button>
    <button id="reset">처음으로</button>
    (그래프를 클릭하면 그 위치에서 다시 시작)
  </div>
  <div>
    <label>학습률 η: <input id="eta" type="range" min="0" max="1000" step="1"></label>
    <span id="etaValue"></span>
  </div>
  <p>
    상태: <span id="status"></span><br>
    반복 횟수: <span id="k"></span><br>
    θ = <span id="theta"></span><br>
    J(θ) = <span id="j"></span><br>
    J′(θ) = <span id="dj"></span>
  </p>

  <script type="module">
    import { derivative, step, stopReason, findFeatures, judgeState } from './src/gd.js';
    import { CURVES } from './src/curves.js';

    const INTERVAL_MS = 300;

    // 학습률 슬라이더: 0~1000 위치를 로그 눈금 0.001~2 로 변환, 표시값(유효숫자 3자리)으로 반올림
    const LOG_MIN = Math.log10(0.001), LOG_MAX = Math.log10(2);
    const posToEta = (pos) => Number((10 ** (LOG_MIN + (pos / 1000) * (LOG_MAX - LOG_MIN))).toPrecision(3));
    const etaToPos = (eta) => Math.round(((Math.log10(eta) - LOG_MIN) / (LOG_MAX - LOG_MIN)) * 1000);

    const STATUS_TEXT = {
      idle: '대기',
      playing: '재생 중',
      paused: '일시정지',
      converged: '수렴',
      diverged: '발산',
      maxIter: '최대 반복 도달',
    };
    const STATE_TEXT = {
      global: '전역 최솟값 도달',
      local: '지역 최솟값에 갇힘',
      plateauMoving: '평지에서 느리게 이동 중',
      plateauStopped: '평지에서 멈춤',
    };

    const canvas = document.getElementById('plot');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('play');
    const stepBtn = document.getElementById('step');
    const etaInput = document.getElementById('eta');

    let curve;            // 선택된 곡선 (CURVES 항목)
    let features;         // findFeatures 결과
    let xMin, xMax, yMin, yMax;
    let start;            // 시작 θ (곡선의 theta0 또는 클릭한 위치)
    let theta, k, eta;
    let timer = null;     // 재생 중이면 setInterval id
    let reason = null;    // 멈춘 이유 (converged | diverged | maxIter)

    const toX = (x) => ((x - xMin) / (xMax - xMin)) * canvas.width;
    const toY = (y) => canvas.height - ((y - yMin) / (yMax - yMin)) * canvas.height;
    const toTheta = (px) => xMin + (px / canvas.width) * (xMax - xMin);

    function selectCurve(c) {
      curve = c;
      [xMin, xMax] = c.range;
      features = findFeatures(c.f, c.range);
      // y 범위: 곡선을 샘플링한 최소~최대 + 위아래 여백 (위는 라벨 자리로 10%)
      const ys = Array.from({ length: 301 }, (_, i) => c.f(xMin + (i / 300) * (xMax - xMin)));
      const lo = Math.min(...ys), hi = Math.max(...ys);
      yMin = lo - (hi - lo) * 0.05;
      yMax = hi + (hi - lo) * 0.1;
      eta = c.eta0;
      etaInput.value = etaToPos(eta);
      start = c.theta0;
      reset();
    }

    function draw() {
      const f = curve.f;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';

      // 평지 구간: 회색 띠 + "평지" 라벨
      for (const p of features.plateaus) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        ctx.fillRect(toX(p.from), 0, toX(p.to) - toX(p.from), canvas.height);
        ctx.fillStyle = '#555';
        ctx.fillText('평지', toX((p.from + p.to) / 2), 14);
      }

      // 최솟값: 점선 + 라벨 (전역 초록, 지역 주황)
      for (const m of features.minima) {
        const color = m.global ? 'green' : 'orange';
        ctx.strokeStyle = color;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(toX(m.theta), toY(m.J));
        ctx.lineTo(toX(m.theta), 20);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = color;
        // 라벨이 캔버스 밖으로 잘리지 않게 가장자리에서 안쪽으로
        const labelX = Math.min(Math.max(toX(m.theta), 35), canvas.width - 35);
        ctx.fillText(m.global ? '전역 최솟값' : '지역 최솟값', labelX, 30);
      }

      // 곡선
      ctx.strokeStyle = '#333';
      ctx.beginPath();
      for (let i = 0; i <= 300; i++) {
        const x = xMin + (i / 300) * (xMax - xMin);
        if (i === 0) ctx.moveTo(toX(x), toY(f(x)));
        else ctx.lineTo(toX(x), toY(f(x)));
      }
      ctx.stroke();

      // 현재 점 (발산하면 캔버스 밖으로 나가 보이지 않을 수 있음)
      ctx.beginPath();
      ctx.arc(toX(theta), toY(f(theta)), 6, 0, 2 * Math.PI);
      ctx.fillStyle = 'red';
      ctx.fill();

      // 상태: 세분화 판정이 있으면 그 문구, 없으면 기본 상태
      const state = k > 0 ? judgeState(reason, theta, features, curve.range) : null;
      const status = STATE_TEXT[state] ?? STATUS_TEXT[reason ?? (timer ? 'playing' : k > 0 ? 'paused' : 'idle')];
      document.getElementById('status').textContent = status;
      document.getElementById('k').textContent = k;
      document.getElementById('theta').textContent = theta.toFixed(4);
      document.getElementById('j').textContent = f(theta).toFixed(4);
      document.getElementById('dj').textContent = derivative(f, theta).toFixed(4);
      document.getElementById('etaValue').textContent = eta;

      playBtn.textContent = timer ? '일시정지' : '재생';
      playBtn.disabled = reason !== null;
      stepBtn.disabled = reason !== null;
    }

    function doStep() {
      theta = step(curve.f, theta, eta);
      k++;
      reason = stopReason(curve.f, theta, k);
      if (reason) pause();
      draw();
    }

    function play() {
      timer = setInterval(doStep, INTERVAL_MS);
      draw();
    }

    function pause() {
      clearInterval(timer);
      timer = null;
      draw();
    }

    // 시작점(곡선 기본값 또는 마지막으로 클릭한 위치)으로 되돌림
    function reset() {
      theta = start;
      k = 0;
      reason = null;
      pause();
    }

    // 예시 곡선 버튼
    for (const c of CURVES) {
      const btn = document.createElement('button');
      btn.textContent = c.name;
      btn.addEventListener('click', () => selectCurve(c));
      document.getElementById('curves').append(btn, ' ');
    }
    playBtn.addEventListener('click', () => (timer ? pause() : play()));
    stepBtn.addEventListener('click', doStep);
    document.getElementById('reset').addEventListener('click', reset);
    // 실행 중에 바꾸면 다음 스텝부터 새 η 적용
    etaInput.addEventListener('input', () => {
      eta = posToEta(Number(etaInput.value));
      draw();
    });
    // 그래프 아무 곳이나 클릭: 그 x 위치의 θ에서 다시 시작
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const px = (e.clientX - rect.left) * (canvas.width / rect.width);
      start = toTheta(px);
      reset();
    });

    selectCurve(CURVES[0]);
  </script>
</body>
</html>
