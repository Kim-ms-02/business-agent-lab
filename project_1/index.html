<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>경사하강법 v0.4</title>
</head>
<body>
  <div id="curves">예시 곡선: </div>
  <div>
    <label>J(x) = <input id="expr" size="45" spellcheck="false"></label>
    <label>θ 범위 <input id="tmin" type="number" step="any" style="width:5em"></label>
    <label>~ <input id="tmax" type="number" step="any" style="width:5em"></label>
    <button id="apply">적용</button>
  </div>
  <div id="error" style="color:#c00; min-height:1.2em"></div>
  <canvas id="plot" width="600" height="400" style="border:1px solid #ccc; cursor:crosshair"></canvas>
  <div>
    <button id="play">재생</button>
    <button id="step">한 스텝</button>
    <button id="reset">처음으로</button>
    (그래프를 클릭하면 그 위치에서 다시 시작)
  </div>
  <div>
    <label>학습률 η: <input id="eta" type="range" min="0" max="1000" step="1"></label>
    <span id="etaValue"></span>
  </div>
  <p>
    상태: <span id="status"></span><br>
    반복 횟수: <span id="k"></span><br>
    θ = <span id="theta"></span><br>
    J(θ) = <span id="j"></span><br>
    J′(θ) = <span id="dj"></span>
  </p>

  <div id="formula">
    <b>공식 읽기</b>
    <div style="font-size:1.4em; margin:6px 0">
      <span data-sym="next">θ_new</span> = <span data-sym="theta">θ</span> <span data-sym="minus">−</span>
      <span data-sym="move"><span data-sym="eta">η</span> · <span data-sym="grad">J′(θ)</span></span>
    </div>
    <div id="substituted"></div>
    <table id="symbols" style="border-collapse:collapse; margin-top:6px"></table>
  </div>

  <script type="module">
    import { derivative, step, stepDetail, tangentAt, stopReason, findFeatures, judgeState } from './src/gd.js';
    import { COLORS, SYMBOLS, substituted } from './src/formula.js';
    import { CURVES } from './src/curves.js';
    import { parseFunction, checkDefinedOnRange, ParseError } from './src/parser.js';

    const INTERVAL_MS = 300;
    const TANGENT_PX = 80; // 접선을 공 양쪽으로 그릴 화면 길이

    // 학습률 슬라이더: 0~1000 위치를 로그 눈금 0.001~2 로 변환, 표시값(유효숫자 3자리)으로 반올림
    const LOG_MIN = Math.log10(0.001), LOG_MAX = Math.log10(2);
    const posToEta = (pos) => Number((10 ** (LOG_MIN + (pos / 1000) * (LOG_MAX - LOG_MIN))).toPrecision(3));
    const etaToPos = (eta) => Math.round(((Math.log10(eta) - LOG_MIN) / (LOG_MAX - LOG_MIN)) * 1000);

    const STATUS_TEXT = {
      idle: '대기',
      playing: '재생 중',
      paused: '일시정지',
      converged: '수렴',
      diverged: '발산',
      maxIter: '최대 반복 도달',
    };
    const STATE_TEXT = {
      global: '전역 최솟값 도달',
      local: '지역 최솟값에 갇힘',
      plateauMoving: '평지에서 느리게 이동 중',
      plateauStopped: '평지에서 멈춤',
    };

    const canvas = document.getElementById('plot');
    const ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('play');
    const stepBtn = document.getElementById('step');
    const etaInput = document.getElementById('eta');
    const exprInput = document.getElementById('expr');
    const tminInput = document.getElementById('tmin');
    const tmaxInput = document.getElementById('tmax');

    let curve;            // 현재 곡선 { f, range }
    let features;         // findFeatures 결과
    let xMin, xMax, yMin, yMax;
    let start;            // 시작 θ (곡선의 theta0 또는 클릭한 위치)
    let theta, k, eta;
    let timer = null;     // 재생 중이면 setInterval id
    let reason = null;    // 멈춘 이유 (converged | diverged | maxIter)
    let highlight = null; // 공식 읽기 칸에서 마우스를 올린 기호 id

    const toX = (x) => ((x - xMin) / (xMax - xMin)) * canvas.width;
    const toY = (y) => canvas.height - ((y - yMin) / (yMax - yMin)) * canvas.height;
    const toTheta = (px) => xMin + (px / canvas.width) * (xMax - xMin);

    // 입력칸의 식과 θ 범위를 해석해 적용. 잘못되면 오류를 보여주고 현재 곡선은 그대로 둔다.
    // example: 예시 곡선 버튼에서 왔으면 그 곡선의 시작 θ와 η를 쓴다
    function applyInput(example = null) {
      const errorEl = document.getElementById('error');
      let f, range;
      try {
        f = parseFunction(exprInput.value);
        range = readRange();
        checkDefinedOnRange(f, range);
      } catch (err) {
        if (!(err instanceof ParseError)) throw err;
        errorEl.textContent = err.message;
        return;
      }
      errorEl.textContent = '';

      curve = { f, range };
      [xMin, xMax] = range;
      features = findFeatures(f, range);
      // y 범위: 곡선을 샘플링한 최소~최대(정의되는 점만) + 위아래 여백 (위는 라벨 자리로 10%)
      const ys = Array.from({ length: 301 }, (_, i) => f(xMin + (i / 300) * (xMax - xMin))).filter(Number.isFinite);
      const lo = Math.min(...ys), hi = Math.max(...ys);
      const span = hi - lo || 1; // 상수 함수면 높이 1로
      yMin = lo - span * 0.05;
      yMax = hi + span * 0.1;
      if (example) {
        eta = example.eta0;
        etaInput.value = etaToPos(eta);
        start = example.theta0;
      } else if (!(start >= xMin && start <= xMax)) {
        // 직접 입력: 시작점이 새 범위 밖이면 왼쪽 끝에서 10% 지점으로, η는 그대로
        start = xMin + (xMax - xMin) * 0.1;
      }
      reset();
    }

    function readRange() {
      const a = tminInput.value.trim(), b = tmaxInput.value.trim();
      if (a === '' || b === '') throw new ParseError('θ 범위의 최소와 최대를 모두 입력하세요.');
      const lo = Number(a), hi = Number(b);
      if (!Number.isFinite(lo) || !Number.isFinite(hi)) throw new ParseError('θ 범위는 숫자여야 합니다.');
      if (lo >= hi) throw new ParseError('θ 범위의 최소는 최대보다 작아야 합니다.');
      return [lo, hi];
    }

    function draw() {
      const f = curve.f;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';

      // 평지 구간: 회색 띠 + "평지" 라벨
      for (const p of features.plateaus) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        ctx.fillRect(toX(p.from), 0, toX(p.to) - toX(p.from), canvas.height);
        ctx.fillStyle = '#555';
        ctx.fillText('평지', toX((p.from + p.to) / 2), 14);
      }

      // 최솟값: 점선 + 라벨 (전역 초록, 지역 주황)
      for (const m of features.minima) {
        const color = m.global ? 'green' : 'orange';
        ctx.strokeStyle = color;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(toX(m.theta), toY(m.J));
        ctx.lineTo(toX(m.theta), 20);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = color;
        // 라벨이 캔버스 밖으로 잘리지 않게 가장자리에서 안쪽으로
        const labelX = Math.min(Math.max(toX(m.theta), 35), canvas.width - 35);
        ctx.fillText(m.global ? '전역 최솟값' : '지역 최솟값', labelX, 30);
      }

      // 곡선 (값이 정의되지 않는 점에서는 선을 끊음)
      ctx.strokeStyle = '#333';
      ctx.beginPath();
      let penDown = false;
      for (let i = 0; i <= 300; i++) {
        const x = xMin + (i / 300) * (xMax - xMin);
        const y = f(x);
        if (!Number.isFinite(y)) { penDown = false; continue; }
        if (penDown) ctx.lineTo(toX(x), toY(y));
        else ctx.moveTo(toX(x), toY(y));
        penDown = true;
      }
      ctx.stroke();

      // 접선, 이동량 화살표, 다음 위치 점, 현재 점
      const detail = stepDetail(f, theta, eta);
      if (Number.isFinite(f(theta))) {
        drawTangent(f);
        drawMoveArrow(f, detail);
        drawNextPoint(f, detail);
      }
      drawBall(f);
      renderFormula(detail);

      // 상태: 세분화 판정이 있으면 그 문구, 없으면 기본 상태
      const state = k > 0 ? judgeState(reason, theta, features, curve.range) : null;
      const status = STATE_TEXT[state] ?? STATUS_TEXT[reason ?? (timer ? 'playing' : k > 0 ? 'paused' : 'idle')];
      document.getElementById('status').textContent = status;
      document.getElementById('k').textContent = k;
      document.getElementById('theta').textContent = theta.toFixed(4);
      document.getElementById('j').textContent = f(theta).toFixed(4);
      document.getElementById('dj').textContent = derivative(f, theta).toFixed(4);
      document.getElementById('etaValue').textContent = eta;

      playBtn.textContent = timer ? '일시정지' : '재생';
      playBtn.disabled = reason !== null;
      stepBtn.disabled = reason !== null;
    }

    // 공식 읽기 칸: 숫자 대입식과 기호별 현재 값
    function renderFormula(detail) {
      const s = { theta, eta, detail };
      document.getElementById('substituted').textContent = substituted(s);
      for (const sym of SYMBOLS) {
        document.getElementById(`value-${sym.id}`).textContent = sym.value(s);
      }
    }

    // 공식 칸의 기호 표 만들기 (처음 한 번). 기호 색은 그래프 요소와 같게
    function buildFormulaTable() {
      const table = document.getElementById('symbols');
      for (const sym of SYMBOLS) {
        const row = table.insertRow();
        row.dataset.sym = sym.id;
        const cells = [sym.symbol, sym.meaning, ''];
        cells.forEach((text, i) => {
          const cell = row.insertCell();
          cell.textContent = text;
          cell.style.padding = '2px 10px';
          if (i === 0) { cell.style.color = COLORS[sym.id]; cell.style.fontWeight = 'bold'; }
          if (i === 2) cell.id = `value-${sym.id}`;
        });
      }
      for (const el of document.querySelectorAll('#formula span[data-sym]')) {
        el.style.color = COLORS[el.dataset.sym];
        el.style.fontWeight = 'bold';
      }
    }

    // 강조 상태에 따라 선 굵기·투명도를 정한다 (highlight: 마우스를 올린 기호 id, 없으면 null)
    // ids: 이 그래프 요소를 강조하는 기호 id 목록
    function emphasis(ids) {
      if (highlight === null) return { width: 2, alpha: 1 };
      return ids.includes(highlight) ? { width: 4, alpha: 1 } : { width: 2, alpha: 0.25 };
    }

    // 접선: 공을 지나고 기울기 J′(θ), 화면에서 공 양쪽으로 TANGENT_PX 씩
    function drawTangent(f) {
      const { slope } = tangentAt(f, theta);
      if (!Number.isFinite(slope)) return;
      // 화면 좌표에서의 방향 (x 1픽셀당 y 픽셀 변화)
      const pxPerX = canvas.width / (xMax - xMin), pxPerY = canvas.height / (yMax - yMin);
      const dx = 1, dy = -slope * (pxPerY / pxPerX);
      const len = Math.hypot(dx, dy);
      const ux = (dx / len) * TANGENT_PX, uy = (dy / len) * TANGENT_PX;
      const cx = toX(theta), cy = toY(f(theta));
      const { width, alpha } = emphasis(['grad']);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = COLORS.grad;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(cx - ux, cy - uy);
      ctx.lineTo(cx + ux, cy + uy);
      ctx.stroke();
      ctx.restore();
    }

    // 이동량 화살표: 공 높이에서 수평으로 θ → θ_new (다음 스텝 미리보기). 캔버스 밖이면 가장자리에서 자름
    function drawMoveArrow(f, { next }) {
      const y = toY(f(theta));
      const x0 = toX(theta);
      const x1 = Math.min(Math.max(toX(next), 0), canvas.width);
      const { width, alpha } = emphasis(['move', 'eta']);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = ctx.fillStyle = COLORS.move;
      if (!Number.isFinite(x1) || Math.abs(x1 - x0) < 3) {
        ctx.fillText('이동량 ≈ 0', x0, y - 14);
        ctx.restore();
        return;
      }
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(x1, y);
      ctx.stroke();
      // 화살표 머리: 기울기의 반대 방향을 가리킴 ('−' 기호에 마우스를 올리면 강조)
      const dir = Math.sign(x1 - x0);
      const head = emphasis(['move', 'eta', 'minus']);
      ctx.globalAlpha = head.alpha;
      const size = highlight === 'minus' ? 14 : 9;
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x1 - dir * size, y - size * 0.6);
      ctx.lineTo(x1 - dir * size, y + size * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 다음 위치 θ_new 의 흐린 점 (항상 표시)
    function drawNextPoint(f, { next }) {
      const y = f(next);
      if (!Number.isFinite(y)) return;
      const { alpha } = emphasis(['next']);
      ctx.save();
      ctx.globalAlpha = alpha * (highlight === 'next' ? 1 : 0.5);
      ctx.fillStyle = COLORS.next;
      ctx.beginPath();
      ctx.arc(toX(next), toY(y), highlight === 'next' ? 7 : 5, 0, 2 * Math.PI);
      ctx.fill();
      ctx.restore();
    }

    // 현재 점 (발산하면 캔버스 밖으로 나가 보이지 않을 수 있음). θ에 마우스를 올리면 세로 점선도 표시
    function drawBall(f) {
      const { alpha } = emphasis(['theta']);
      ctx.save();
      ctx.globalAlpha = alpha;
      if (highlight === 'theta') {
        ctx.strokeStyle = COLORS.theta;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(toX(theta), 0);
        ctx.lineTo(toX(theta), canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      ctx.beginPath();
      ctx.arc(toX(theta), toY(f(theta)), highlight === 'theta' ? 8 : 6, 0, 2 * Math.PI);
      ctx.fillStyle = COLORS.theta;
      ctx.fill();
      ctx.restore();
    }

    function doStep() {
      theta = step(curve.f, theta, eta);
      k++;
      reason = stopReason(curve.f, theta, k);
      if (reason) pause();
      draw();
    }

    function play() {
      timer = setInterval(doStep, INTERVAL_MS);
      draw();
    }

    function pause() {
      clearInterval(timer);
      timer = null;
      draw();
    }

    // 시작점(곡선 기본값 또는 마지막으로 클릭한 위치)으로 되돌림
    function reset() {
      theta = start;
      k = 0;
      reason = null;
      pause();
    }

    // 예시 곡선 버튼: 입력칸에 식과 범위를 채우고 해석기를 거쳐 적용
    function loadExample(c) {
      exprInput.value = c.expr;
      tminInput.value = c.range[0];
      tmaxInput.value = c.range[1];
      applyInput(c);
    }
    for (const c of CURVES) {
      const btn = document.createElement('button');
      btn.textContent = c.name;
      btn.addEventListener('click', () => loadExample(c));
      document.getElementById('curves').append(btn, ' ');
    }
    document.getElementById('apply').addEventListener('click', () => applyInput());
    for (const input of [exprInput, tminInput, tmaxInput]) {
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyInput(); });
    }
    playBtn.addEventListener('click', () => (timer ? pause() : play()));
    stepBtn.addEventListener('click', doStep);
    document.getElementById('reset').addEventListener('click', reset);
    // 실행 중에 바꾸면 다음 스텝부터 새 η 적용
    etaInput.addEventListener('input', () => {
      eta = posToEta(Number(etaInput.value));
      draw();
    });
    // 그래프 아무 곳이나 클릭: 그 x 위치의 θ에서 다시 시작
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const px = (e.clientX - rect.left) * (canvas.width / rect.width);
      start = toTheta(px);
      reset();
    });

    buildFormulaTable();
    loadExample(CURVES[0]);
  </script>
</body>
</html>
